  function journeySummary(){const j=journey();return `<section class="journey-panel"><button type="button" data-page="journey" class="section-link cursor-interaction"><span class="eyebrow">JOURNEY</span>${icon('chevron-right')}</button><div class="journey-name">${j.title}</div><div class="journey-amount"><strong>${fmt(j.total,j.distance)}<small>/ ${j.target} ${j.unit}</small></strong><span>${j.kind}</span></div>${progress(j)}<div class="contribution">${icon('plus')}이번 운동 ${fmt(j.added,j.distance)} ${j.unit}</div></section>`;}
  function passportSummary(){return `<section class="passport-panel"><button type="button" data-page="passport" class="section-link cursor-interaction"><span><span class="eyebrow">PASSPORT</span><h3 style="margin-top:5px">이번에 얻은 업적</h3></span>${icon('chevron-right')}</button><div class="medals">${achievements().map(medal).join('')}</div></section>`;}
  function nav(title,share=false){return `<div class="app-nav">${state.page==='detail'?'<div><div class="wordmark">DUNE</div><div class="nav-label">운동 기록</div></div>':`<button type="button" data-page="detail" class="cursor-interaction">${icon('chevron-left')}운동 기록</button>`}<span class="nav-label">${title}</span>${share?`<button type="button" data-page="share" class="cursor-interaction">${icon('share-2')}공유</button>`:'<span aria-hidden="true"></span>'}</div>`;}
  function detail(){return `${nav('ATLAS',true)}<div class="screen-body"><div class="record-heading"><div><p class="date-line">2026년 10월 29일 · 07:12</p><h2>${workoutName()}</h2></div><span class="activity-mark">${icon(marks[state.activity])}</span></div><div class="record-stats">${primary()}${stats()}</div><div class="record-grid"><section class="atlas-panel"><div class="panel-head"><div><div class="eyebrow">ATLAS</div><strong>${moving()?'이동 경로':'운동 장소'}</strong></div><span class="eyebrow">${envLabel()}</span></div>${map()}${credit()}<div class="place-line">${icon('map-pin')}<div>${placeName()}<small>${moving()?'기록 순서로 표시한 진행 방향':'직접 선택한 장소 · 예시'}</small></div></div>${!moving()&&state.environment!=='missing'&&state.environment!=='stationary'?`<div class="point-options" role="group" aria-label="예시 장소 선택"><button type="button" data-venue="center" aria-pressed="${state.venue==='center'}" class="cursor-interaction">체육센터</button><button type="button" data-venue="culture" aria-pressed="${state.venue==='culture'}" class="cursor-interaction">문화센터</button><button type="button" data-venue="unset" aria-pressed="${state.venue==='unset'}" class="cursor-interaction">미지정</button></div>`:''}</section><div class="supplement">${journeySummary()}${passportSummary()}</div></div><div class="record-baseline"><span>평균 심박 ${p().stats.find(([label])=>label==='평균 심박')?.[1]||'146 bpm'}</span><span>기록 수치 · 예시</span></div><button type="button" data-page="share" class="primary-action cursor-interaction">${icon('share-2')}공유 카드 만들기</button></div>`;}
  function sharePoster(){const j=journey(),noLocation=!state.showPlace,signature=state.style==='signature';return `<article class="share-poster ${state.style}" aria-label="통합 유산소 공유 카드"><div class="poster-top"><span class="poster-brand">DUNE</span><span>${state.style==='atlas'?'ACTIVITY ATLAS':state.style==='spectrum'?'PACE RIBBON':'MY SIGNATURE'}</span></div><div class="poster-title">${moving()?'A little further,<br>a little more me.':'Movement,<br>right here.'}</div><p class="poster-meta">${envLabel()} ${p().name} · 2026.10.29</p>${map({shared:true,style:state.style})}${state.style==='spectrum'&&state.showPlace?'<div class="pace-legend"><span>느리게 6′12″</span><i aria-hidden="true"></i><span>5′31″ 빠르게</span></div>':''}${!noLocation&&(!signature||moving())?`<div class="poster-venue">${icon('map-pin')}${placeName()}</div>`:''}${credit(true)}<div class="poster-values">${signature&&!moving()||noLocation?'':primary()}${stats()}</div>${state.includeJourney?`<div class="poster-journey"><div class="mini-row"><span>${j.title} · ${j.kind}</span><strong>${fmt(j.total,j.distance)} / ${j.target} ${j.unit}</strong></div>${progress(j)}</div>`:''}${state.includePassport?`<div class="poster-achievements">${achievements().map(a=>`<span>${icon(a.icon)}${a.title}</span>`).join('')}</div>`:''}<p class="poster-foot">${noLocation?'장소 제외 · 전체 기록 수치':moving()&&state.trim?'출발·도착 300m 숨김 · 전체 기록 수치':moving()?'전체 경로 · 전체 기록 수치':'운동 장소 표시'}</p></article>`;}
  function share(){return `${nav('공유 카드')}<div class="screen-body"><h2>나의 운동, 한 장으로</h2><p class="section-note">스타일과 담을 기록을 골라 보세요.</p><div class="style-picker" role="group" aria-label="공유 스타일"><button type="button" data-style="atlas" aria-pressed="${state.style==='atlas'}" class="cursor-interaction">${icon('map')}아틀라스</button><button type="button" data-style="spectrum" aria-pressed="${state.style==='spectrum'}" ${hasSplits()?'':'disabled'} class="cursor-interaction">${icon('activity')}페이스 리본</button><button type="button" data-style="signature" aria-pressed="${state.style==='signature'}" class="cursor-interaction">${icon('route')}시그니처</button></div>${sharePoster()}<div class="share-controls"><label><input type="checkbox" data-option="includeJourney" ${state.includeJourney?'checked':''}>저니 진행 포함</label><label><input type="checkbox" data-option="includePassport" ${state.includePassport?'checked':''}>패스포트 업적 포함</label><label><input type="checkbox" data-option="showPlace" ${state.showPlace?'checked':''}>${moving()?'지도와 장소 공유':'운동 장소 공유'}</label>${moving()?`<label><input type="checkbox" data-option="trim" ${state.trim?'checked':''} ${state.showPlace?'':'disabled'}>출발·도착 300m 숨김</label>`:''}${!hasSplits()?`<p class="share-help">구간 페이스가 없는 기록은 아틀라스와 시그니처를 선택할 수 있어요.${!moving()?' 시그니처에는 운동 수치를 크게 담아요.':''}</p>`:''}</div></div>`;}
  function journeyPage(){const j=journey();return `${nav('JOURNEY')}<div class="screen-body"><p class="eyebrow">${j.kind}</p><h2 style="margin-top:8px">${j.title}</h2><p class="section-note">${j.distance?'여러 운동의 실제 거리를 모은 가상 여정이에요.':'실내·실외에서 기록한 운동 시간을 모아요.'}</p><div class="goal-hero"><div class="journey-amount"><strong>${fmt(j.total,j.distance)}<small>/ ${j.target} ${j.unit}</small></strong><span>${Math.round(j.percent)}%</span></div>${progress(j)}<div class="milestones"><span>시작</span><span>절반</span><span>${j.target} ${j.unit}</span></div><p class="contribution">${icon('plus')}이번 운동으로 ${fmt(j.added,j.distance)} ${j.unit} 더했어요</p><p class="section-note">${j.target>j.total?`${fmt(j.target-j.total,j.distance)} ${j.unit} 남았어요`:'목표를 달성했어요'}</p></div><div class="record-list"><h3>여정에 더한 기록</h3><div class="record-row"><div>${p().name}<small>오늘 · ${envLabel()}</small></div><strong>+${fmt(j.added,j.distance)} ${j.unit}</strong></div><div class="record-row"><div>이전 운동 기록<small>10월 1일–28일 누적</small></div><strong>${fmt(j.prior,j.distance)} ${j.unit}</strong></div></div><p class="section-note" style="margin-top:20px">${j.distance?'가상 여정의 진행은 실제 장소 방문과 별도로 기록해요.':'층수·횟수를 이동 거리로 바꾸지 않아요.'}</p><button type="button" data-page="share" class="primary-action cursor-interaction">${icon('share-2')}운동과 여정 함께 담기</button></div>`;}
  function passportPage(){const list=achievements();return `${nav('PASSPORT')}<div class="screen-body"><div class="passport-cover"><p class="eyebrow">MY MOVEMENT PASSPORT</p><h2 style="margin-top:10px">쌓이는 운동,<br>남는 성취.</h2><p class="section-note">이번 ${p().name}으로 얻은 업적 ${list.length}개</p></div><div class="badge-list">${list.map(a=>`<div class="badge-row"><span class="medal-mark">${icon(a.icon)}</span><div><strong>${a.title}</strong><p>${a.detail}</p><p>2026.10.29 획득 · 예시</p></div></div>`).join('')}</div><div class="next-achievement"><p class="eyebrow">NEXT</p><h3 style="margin-top:8px">누적 20회</h3><p>같은 종목 운동 12 / 20회</p><div class="progress-rail" role="progressbar" aria-label="누적 20회 업적 진행" aria-valuemin="0" aria-valuemax="20" aria-valuenow="12"><i style="width:60%"></i></div><p>다음 업적까지 8회 남았어요.</p></div><button type="button" data-page="share" class="primary-action cursor-interaction">${icon('share-2')}운동과 업적 함께 담기</button></div>`;}
  function render(){
    validateStyle();root.dataset.appearance=state.appearance;root.dataset.large=String(state.large);
    root.querySelector('[data-setting="environment"]').value=state.environment;
    const picker=root.querySelector('[data-setting="activity"]');if(!picker.options.length)picker.innerHTML=Object.entries(names).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');picker.value=state.activity;
    root.querySelector('.atlas-screen').innerHTML=state.page==='detail'?detail():state.page==='share'?share():state.page==='journey'?journeyPage():passportPage();
    if(globalThis.lucide)lucide.createIcons();
  }
  function updateShare(){
    const poster=root.querySelector('.share-poster');if(!poster){render();return;}
    poster.outerHTML=sharePoster();
    root.querySelectorAll('[data-option]').forEach(input=>{input.checked=state[input.dataset.option];if(input.dataset.option==='trim')input.disabled=!state.showPlace;});
    root.querySelectorAll('[data-style]').forEach(button=>button.setAttribute('aria-pressed',String(state.style===button.dataset.style)));
    if(globalThis.lucide)lucide.createIcons();
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{environment:state.environment,activity:state.activity,page:state.page,style:state.style,includeJourney:state.includeJourney,includePassport:state.includePassport,showPlace:state.showPlace},privateContent:{...state,origin}})?.catch(()=>{});}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){state.page=b.dataset.page;render();root.querySelector('.atlas-app').scrollIntoView({block:'start'});save();}if(b.dataset.style){state.style=b.dataset.style;updateShare();save();}if(b.dataset.venue){state.venue=b.dataset.venue;render();save();}});
  root.addEventListener('change',event=>{const e=event.target;if(e.dataset.setting){state[e.dataset.setting]=e.value;state.page='detail';render();save();}if(e.dataset.option){state[e.dataset.option]=e.checked;updateShare();save();}});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next&&next.origin!==origin){const before=JSON.stringify(state);restore(next);if(before!==JSON.stringify(state))render();}});
  render();
  if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();save();}});t.addSelect(state,'appearance',{label:'화면 밝기',options:[{label:'시스템',value:'system'},{label:'밝게',value:'light'},{label:'어둡게',value:'dark'}]});t.addToggle(state,'large',{label:'큰 글씨'});}
})();
</script>
