<script>
(()=>{
const root=document.getElementById('today-restart');
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const chevron=`<i class="chevron" data-lucide="chevron-right" aria-hidden="true"></i>`;
const chrome=`<div class="dunes" aria-hidden="true"><div class="dune-layer far"></div><div class="dune-layer mid"></div><div class="dune-layer near"></div></div><div class="chrome"><div class="status"><span>9:41</span><div class="island" aria-hidden="true"></div><span class="signals">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><header class="titlebar"><div><h1>Today</h1><div class="date">10월 26일 월요일</div></div><div class="tools"><button class="tool cursor-interaction" data-message="새로운 소식 2개" aria-label="알림 2개">${icon('bell')}<span class="badge"></span></button><button class="tool cursor-interaction" data-message="시안 보기 설정은 디자인 조절 메뉴에서 변경할 수 있어요." aria-label="설정">${icon('settings-2')}</button></div></header></div>`;
const nav=`<nav class="bottomnav" aria-label="탭"><button class="navitem selected cursor-interaction" aria-current="page" data-message="Today 탭을 보고 있어요.">${icon('clipboard-list')}Today</button><button class="navitem cursor-interaction" data-message="Activity는 다음 디자인 단계에서 다뤄요.">${icon('flame')}Activity</button><button class="navitem cursor-interaction" data-message="Wellness는 다음 디자인 단계에서 다뤄요.">${icon('leaf')}Wellness</button><button class="navitem cursor-interaction" data-message="Life는 다음 디자인 단계에서 다뤄요.">${icon('list-checks')}Life</button></nav><div class="home" aria-hidden="true"></div>`;
const empty=`<div class="empty-note">아직 기록이 없어요.<br>Apple Health와 연결하면 오늘의 흐름을 볼 수 있어요.</div>`;
const ring=(id)=>`<div class="ring" role="img" aria-label="컨디션 52점, 100점 중 52점"><svg viewBox="0 0 104 104" aria-hidden="true"><defs><linearGradient id="${id}-ring"><stop stop-color="#e2b453"/><stop offset=".55" stop-color="#f4d678"/><stop offset="1" stop-color="#b2d59a"/></linearGradient></defs><circle cx="52" cy="52" r="48.5" fill="none" stroke="#d7c98c" stroke-opacity=".12" stroke-width="7"/><circle cx="52" cy="52" r="48.5" fill="none" stroke="url(#${id}-ring)" stroke-width="7" stroke-linecap="round" class="ring-progress" pathLength="100" stroke-dasharray="52 100" transform="rotate(-90 52 52)"/></svg><div class="ring-copy"><div class="ring-number">52</div></div></div>`;
const trend=(id)=>`<div class="trend-head"><span>컨디션 추세</span><span>최근 7일 · 점수</span></div><svg class="trend" viewBox="0 0 330 47" preserveAspectRatio="none" role="img" aria-label="최근 7일 컨디션 68, 72, 65, 61, 58, 47, 52점"><defs><linearGradient id="${id}-area" x2="0" y2="1"><stop stop-color="#dfc58b" stop-opacity=".22"/><stop offset="1" stop-color="#dfc58b" stop-opacity="0"/></linearGradient></defs><path d="M2 14 L56 9 L110 18 L164 23 L218 27 L272 41 L328 35 L328 47 L2 47Z" fill="url(#${id}-area)"/><path d="M2 14 L56 9 L110 18 L164 23 L218 27 L272 41 L328 35" fill="none" stroke="#dfc58b" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="328" cy="35" r="3" fill="#ebdbb6"/></svg><div class="axis"><span>10.20</span><span>오늘 · 52</span></div>`;
const sleep=(id,weekly=false)=>`<article class="surface sleep"><div class="section-top"><span class="label-icon">${icon('moon')}회복 & 수면</span><span class="muted tiny">10월 25일</span></div><div class="data-content"><div class="sleep-numbers"><div class="value">7<small>시간</small>23<small>분</small></div><div class="debt">수면 부채<b>45분</b></div></div>${weekly?`<div class="bars" role="img" aria-label="최근 7일 수면 6.4, 7.8, 7.1, 6.8, 8.1, 7.9, 7.38시간">${[64,78,71,68,81,79,74].map(h=>`<i style="--h:${h}%"></i>`).join('')}</div><div class="axis"><span>10.19 · 최근 7일</span><span>10.25 · 시간</span></div>`:`<div class="timeline" role="img" aria-label="예시 수면 구간, 23시 42분부터 7시 5분까지">${[8,12,7,15,6,11,4,12,9,8,7,13,8,5].map((s,i)=>`<i style="--seg:${s};--o:${[.5,.75,1,.75][i%4]}"></i>`).join('')}</div><div class="axis"><span>23:42</span><span>수면 구간</span><span>07:05</span></div><div class="sleep-legend"><span><i></i>깊은 수면</span><span><i style="opacity:.75"></i>코어</span><span><i style="opacity:.5"></i>REM</span><span class="muted">수면 상세 ↗</span></div>`}</div>${empty}</article>`;
const stress=`<article class="surface"><div class="section-top"><span class="label-icon">${icon('activity')}누적 스트레스</span><span class="muted tiny">최근 기록 기준</span></div><div class="data-content"><div class="stress-layout"><div class="stress-number">보통<small>최근 흐름이 안정적이에요</small></div><svg class="stress-chart" viewBox="0 0 113 36" role="img" aria-label="최근 기록에서 완만하게 낮아진 스트레스 추세"><path d="M2 12 L19 16 L36 10 L53 21 L70 18 L87 25 L110 23" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="110" cy="23" r="2.5" fill="currentColor"/></svg></div><div class="stress-bottom"><span>HRV · 안정 심박 기반 추정</span><span>상세 ↗</span></div></div>${empty}</article>`;
const progress=`<div class="pair"><article class="surface"><div class="section-top"><span class="label-icon">${icon('footprints')}걸음</span></div><div class="data-content"><div class="value">6,240<small>보</small></div><div class="meter"><i style="--p:62.4%"></i></div><div class="tiny muted">목표 10,000보 · 62%</div></div>${empty}</article><article class="surface"><div class="section-top"><span class="label-icon">${icon('timer')}운동 시간</span></div><div class="data-content"><div class="value">32<small>분</small></div><div class="meter"><i style="--p:71.1%"></i></div><div class="tiny muted">목표 45분 · 71%</div></div>${empty}</article></div>`;
const brief=`<div class="brief"><div class="brief-icon">${icon('sparkles')}</div><div><strong>오늘의 브리프</strong><p>컨디션·수면·활동을 한눈에</p></div>${chevron}</div><details class="cursor-interaction"><summary>핵심 지표 더 보기${chevron}</summary><p class="data-content">HRV 38 ms · 안정 심박 54 bpm<br>컨디션은 평소보다 낮고, 수면은 7시간 23분이에요.</p>${empty}</details>`;
const evidence=`<div class="evidence"><div><span>HRV <small>14일 평균 대비</small></span><b>−5 ms</b></div><div><span>안정 심박 <small>평균 대비</small></span><b>−3 bpm</b></div></div>`;

 if(r==='template')return back+`<section class="surface"><h2>${tr('루틴 템플릿','Routine template','ルーティンテンプレート')}</h2><label class="weight-field">${tr('이름','Name','名前')}<input value="Walking" aria-label="${tr('템플릿 이름','Template name','テンプレート名')}"></label><div class="detail-pairs"><p>Walking<b>14 ${tr('분','min','分')}</b></p></div><button class="save-template cursor-interaction" data-save-template>${tr('저장','Save','保存')}</button><p role="status" data-template-result></p></section>`;
 if(r==='exercise')return back+`<section class="surface"><h2>${tr('오늘의 운동 제안','Today’s workout suggestion','今日の運動提案')}</h2><p>${state.score>=70?tr('컨디션이 평소 범위에 있어요.','Your condition is within your usual range.','コンディションは普段の範囲内です。'):tr('오늘은 가벼운 강도를 참고하세요.','Consider keeping intensity light today.','今日は軽い強度を参考にしてください。')}</p><div class="detail-pairs"><p>${tr('컨디션','Condition','コンディション')}<b>${state.score}</b></p><p>${tr('수면','Sleep','睡眠')}<b>7h 23m</b></p></div><p>${tr('운동 강도와 수면 회복 정보를 함께 보여 드려요.','Intensity and sleep recovery information are shown together.','運動強度と睡眠による回復情報を一緒に表示します。')}</p></section>`;
 if(r==='settings')return back+`<section class="surface"><h2>${tr('설정','Settings','設定')}</h2><div class="detail-pairs"><p>${tr('현재 테마','Current theme','現在のテーマ')}<b>Desert Warm</b></p><p>${tr('건강 데이터','Health data','ヘルスケア')}<b>${tr('연결됨','Connected','接続済み')}</b></p><p>${tr('알림','Notifications','通知')}<b>${tr('사용','On','オン')}</b></p></div>${action(tr('건강 데이터 접근','Health data access','ヘルスケアへのアクセス'),'permissions')}</section>`;
 if(r==='permissions')return back+message(tr('건강 데이터와 위치 접근','Health and location access','健康データと位置情報へのアクセス'),tr('기록과 날씨를 표시하는 데 필요한 접근 권한을 설정에서 관리할 수 있어요.','Manage the permissions used to show your health records and local weather in Settings.','記録と天気の表示に必要なアクセス権を設定で管理できます。'),null,null,'shield-check');
 if(r?.startsWith('all:')){const m=metricDefs.find(x=>x.id===r.split(':')[1]);return back+`<section class="surface"><h2>${m.name[state.locale==='en'?1:state.locale==='ja'?2:0]} · ${tr('모든 데이터','All data','すべてのデータ')}</h2><div class="detail-pairs">${(m.history.length?[...m.history].reverse():[Number(m.value)]).map((v,i)=>`<p>10.${(state.data==='stale'?17:25)-i}<b>${v} ${m.unit}</b></p>`).join('')}</div></section>`;}
 if(r?.startsWith('workout:')){const x=exercises.find(x=>x[1]===r.slice(8));return back+`<section class="surface"><h2>${x[state.locale==='en'?1:state.locale==='ja'?2:0]}</h2><p class="muted">${timeLabel(x[5])}</p><div class="value">${x[3]}<small>${x[4]==='min'?tr('분','min','分'):x[4]}</small></div></section>`;}
 return back+message(tr('활동 기록','Activity records','活動記録'),tr('운동의 전체 흐름과 기록은 Activity에서 볼 수 있어요.','View your workout history and progress in Activity.','運動の履歴と進捗はActivityで確認できます。'),null,null,'flame');
}
let contentKey='';
function buildPhones(force=false){const key=JSON.stringify([state.data,state.time,state.hour,state.locale,state.progress,state.score,state.stress,state.restDay,session.route,[...session.dismissed],session.pins,session.unread]);if(!force&&key===contentKey)return;contentKey=key;
 root.querySelectorAll('.phone').forEach(phone=>{
 const markup=chrome.replace('9:41',String(state.hour).padStart(2,'0')+':00').replace('10월 26일 월요일',tr('10월 26일 월요일','Monday, October 26','10月26日 月曜日')).replace('data-message="새로운 소식 2개"','data-route="notifications"').replace('data-message="시안 보기 설정은 디자인 조절 메뉴에서 변경할 수 있어요."','data-route="settings"');
 phone.innerHTML=markup+`<main class="body ${session.route?'route-body':''}">${session.route?destination():dashboard(phone.dataset.design)}</main>`+nav;
 const badge=phone.querySelector('.badge');if(badge)badge.hidden=session.unread===0;
 const bell=phone.querySelector('[data-route="notifications"]');if(bell)bell.setAttribute('aria-label',tr(`알림 ${session.unread}개`,`${session.unread} notifications`,`通知${session.unread}件`));
 });
 const layers=[{name:'far',center:45,amplitude:8,frequency:.72,skew:.20},{name:'mid',center:62,amplitude:10,frequency:1,skew:.18},{name:'near',center:76,amplitude:13,frequency:1.35,skew:.14}];
 layers.forEach(layer=>{const points=[];for(let x=0;x<=400;x+=5){const a=Math.PI*2*layer.frequency*x/400,y=layer.center+layer.amplitude*(Math.sin(a)+layer.skew*Math.sin(2*a+Math.PI/6));points.push(`${x/4}% ${y/2.2}%`);}root.querySelectorAll('.dune-layer.'+layer.name).forEach(el=>el.style.clipPath=`polygon(${points.join(',')},100% 100%,0 100%)`);});
 if(globalThis.lucide)lucide.createIcons();
}
function sizeStages(){let height=500;root.querySelectorAll('[data-variant]').forEach(section=>{const wasHidden=section.hidden;section.hidden=false;const phone=section.querySelector('.phone');height=Math.max(height,phone.getBoundingClientRect().height+48);section.hidden=wasHidden;});root.style.setProperty('--stage-height',height+'px');}
function render(save=false){state.hour=Math.min(23,Math.max(0,Number(state.hour)||0));state.time=state.hour>=6&&state.hour<10?'morning':state.hour>=10&&state.hour<17?'day':state.hour>=17&&state.hour<22?'evening':'night';state.text=Math.min(200,Math.max(100,Number(state.text)||100));state.width=Math.min(1032,Math.max(320,Number(state.width)||440));state.score=Math.min(100,Math.max(0,Number(state.score)||0));state.stress=Math.min(100,Math.max(0,Number(state.stress)||0));root.style.setProperty('--ambience',(Number(state.ambience)||0)/100);root.style.setProperty('--type',state.text/100);root.style.setProperty('--phone-width',state.width+'px');buildPhones();root.querySelectorAll('.phone').forEach(p=>{p.dataset.mode=['light','dark'].includes(state.appearance)?state.appearance:'auto';p.classList.toggle('large',state.text>=130);p.classList.toggle('enhanced-contrast',!!state.contrast);p.classList.toggle('reduced',!state.motion);p.classList.toggle('collapsed',state.header==='scrolled');p.classList.remove('empty');p.lang=state.locale;});requestAnimationFrame(sizeStages);if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{todayDesign:state}}).catch(()=>{});}
root.addEventListener('click',e=>{const confirm=e.target.closest('[data-confirm-weight]');if(confirm){const form=confirm.closest('[data-weight-form]'),val=Number(form.querySelector('input').value);form.querySelector('[data-form-result]').textContent=Number.isFinite(val)&&val>0&&val<=500?tr(`${val}kg 입력을 확인했어요. 실제로 저장하지 않아요.`,`${val} kg previewed. Nothing was saved.`,`${val}kgの入力を確認しました。保存されません。`):tr('체중을 확인해 주세요.','Check the weight.','体重を確認してください。');return;}const save=e.target.closest('[data-save-template]');if(save){save.parentElement.querySelector('[data-template-result]').textContent=tr('저장되었습니다.','Saved.','保存されました。');return;}const dismiss=e.target.closest('[data-dismiss]');if(dismiss){session.dismissed.add(dismiss.dataset.dismiss);contentKey='';render();return;}const all=e.target.closest('[data-read-all]');if(all){session.unread=0;contentKey='';render();return;}const btn=e.target.closest('[data-route]');if(btn){if(btn.dataset.route==='retry'){state.data='complete';session.route=null;}else session.route=btn.dataset.route==='back'?null:btn.dataset.route;contentKey='';render();return;}const heroTap=e.target.closest('[data-action]');if(heroTap){session.route='condition';contentKey='';render();return;}const tab=e.target.closest('.navitem');if(tab){session.route=tab.classList.contains('selected')?null:'activity';contentKey='';render();}});
root.addEventListener('change',e=>{if(e.target.matches('[data-pin]')){const id=e.target.dataset.pin;session.pins=e.target.checked?[...new Set([...session.pins,id])]:session.pins.filter(x=>x!==id);}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-weight-form] input')){e.preventDefault();e.target.closest('[data-weight-form]').querySelector('[data-confirm-weight]').click();}});
root.addEventListener('submit',e=>{if(e.target.matches('[data-weight-form]')){e.preventDefault();const val=Number(e.target.querySelector('input').value);e.target.querySelector('[data-form-result]').textContent=Number.isFinite(val)&&val>0&&val<=500?tr(`${val}kg 입력을 확인했어요. 실제로 저장하지 않아요.`,`${val} kg previewed. Nothing was saved.`,`${val}kgの入力を確認しました。保存されません。`):tr('체중을 확인해 주세요.','Check the weight.','体重を確認してください。');}});
render();
window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.modelContent?.todayDesign;if(next){Object.assign(state,next);contentKey='';render();}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render(true)});tweak.addSlider(state,'text',{label:'글자 크기',min:100,max:200,step:5,unit:'%'});tweak.addSlider(state,'width',{label:'최대 화면 폭',min:320,max:1032,step:2,unit:'pt'});tweak.addSelect(state,'appearance',{label:'화면 모드',options:[{label:'시스템',value:'auto'},{label:'밝게',value:'light'},{label:'어둡게',value:'dark'}]});tweak.addSelect(state,'data',{label:'기록 상태',options:[{label:'기록 충분',value:'complete'},{label:'일부 누락',value:'partial'},{label:'기록 없음',value:'no-records'},{label:'건강 접근 필요',value:'denied'},{label:'처음 로딩',value:'initial-load'},{label:'새로고침 중',value:'refreshing'},{label:'전체 조회 오류',value:'error-empty'},{label:'일부 조회 오류',value:'error-cached'},{label:'기준선 형성 중',value:'calibrating'},{label:'클라우드 대기',value:'cloud-wait'},{label:'단일 기록',value:'no-trend'},{label:'오래된 기록',value:'stale'}]});tweak.addSlider(state,'hour',{label:'시간대',min:0,max:23,step:1,unit:'시'});tweak.addSelect(state,'locale',{label:'언어 길이 비교',options:[{label:'한국어',value:'ko'},{label:'English',value:'en'},{label:'日本語',value:'ja'}]});tweak.addSelect(state,'progress',{label:'목표 진행 상태',options:[{label:'진행 중',value:'normal'},{label:'100% 초과',value:'over'},{label:'오늘 기록 없음',value:'missing'}]});tweak.addSlider(state,'score',{label:'컨디션 점수',min:0,max:100,step:1});tweak.addSlider(state,'stress',{label:'스트레스 점수',min:0,max:100,step:1});tweak.addSelect(state,'header',{label:'제목 상태',options:[{label:'상단 펼침',value:'top'},{label:'스크롤 후 접힘',value:'scrolled'}]});tweak.addToggle(state,'restDay',{label:'휴식일 · 운동 제안 숨김'});tweak.addToggle(state,'contrast',{label:'대비 높이기'});}
new ResizeObserver(()=>requestAnimationFrame(sizeStages)).observe(root.querySelector('.viz-carousel'));
})();

</script>
