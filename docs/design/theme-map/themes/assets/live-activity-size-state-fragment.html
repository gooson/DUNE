        <select aria-label="경과 시간" id="ls-duration"><option value="1394">23분 14초</option><option value="45">45초</option><option value="4845">1시간 20분 45초</option><option value="43320">12시간 2분</option></select>
      </label>
      <label class="ls-label">심박 데이터
        <select aria-label="심박 데이터" id="ls-heart"><option value="yes">142 bpm</option><option value="no">미수신</option></select>
      </label>
    </div>
    <div class="ls-controls" id="ls-fallback-controls" aria-label="표현 비교" hidden>
      <label class="ls-label">표면<select id="ls-appearance" aria-label="표면"><option value="light">밝음</option><option value="dark">어두움</option></select></label>
      <label class="ls-label">본문 글씨<select id="ls-large" aria-label="본문 글씨"><option value="no">기본</option><option value="yes">크게</option></select></label>
      <label class="ls-label">운동명<select id="ls-name" aria-label="운동명"><option value="short">실외 달리기</option><option value="long">긴 근력 운동명</option></select></label>
    </div>
    <div class="viz-carousel viz-dotted-background" aria-label="표시 우선순위 비교" data-previous-label="이전 시안" data-next-label="다음 시안">
      <section data-variant="골드 임팩트" aria-label="비주얼 강조 시안"><div class="ls-stage ls-glam" data-direction="glam"></div></section>
      <section data-variant="내 선택" aria-label="종목별 선택 시안" hidden><div class="ls-stage" data-direction="time"></div></section>
      <section data-variant="심박 우선" aria-label="심박 우선 시안" hidden><div class="ls-stage" data-direction="heart"></div></section>
    </div>
    <div class="ls-footnote">28pt 제한 폭은 내용 영역 기준 · 카메라와 시스템 배치는 설명용<br>분·시간 축약은 내림 표시 · 일시 정지는 정지 기호 우선 · 연결 대기는 오래된 수치 숨김 · 종료 시 제거<br>시안 글씨 확대는 웹 배치 연구이며 iOS Dynamic Type 검증과 구분합니다.</div>
    <span class="ls-announcement" aria-live="polite" style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)"></span>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('dune-live-study');
  const state = { phase:'running', duration:1394, heart:true, appearance:'light', large:false, longName:false, sport:'cardio', cardioMetric:'distance', strengthMetric:'weight', distance:'4.2', weight:'60' };
  const phases = { running:'운동 중', paused:'일시 정지', stale:'Watch 연결 대기', ended:'운동 종료' };
  const icon = (name, css='') => `<i data-lucide="${name}" class="${css}" aria-hidden="true"></i>`;
  const pad = x => String(x).padStart(2,'0');
  function times() {
    const h=Math.floor(state.duration/3600), m=Math.floor(state.duration/60)%60, s=state.duration%60;
    return {
      full: h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`,
      minimal: h ? `${h}h${pad(m)}` : `${m}:${pad(s)}`,
      short: state.duration < 60 ? `${s}″` : state.duration < 6000 ? `${Math.floor(state.duration/60)}′` : `${h}h`,
      spoken: `${h ? h+'시간 ' : ''}${m}분 ${s}초`
    };
  }
  function phaseIcon(phase) { return icon(({running:'accessibility',paused:'pause',stale:'wifi-off',ended:'check'})[phase]); }
  function preference() {return state.sport==='cardio'?state.cardioMetric:state.strengthMetric;}
  function selected(direction) {
    let kind=direction==='heart'?'heart':preference();
    const missing=(kind==='heart'&&!state.heart)||(kind==='distance'&&state.distance==='missing')||(kind==='weight'&&state.weight==='missing');
    if(missing) kind='time';
    const meta={time:{name:'경과 시간',symbol:state.sport==='strength'?'dumbbell':'accessibility'},heart:{name:'심박수',symbol:'heart'},distance:{name:'누적 거리',symbol:'map-pin'},weight:{name:'현재 세트 중량',symbol:'dumbbell'}}[kind];
    return {kind,missing,...meta,value:kind==='distance'?Number(state.distance).toFixed(2):kind==='weight'?state.weight:kind==='heart'?'142':times().full,unit:kind==='distance'?'km':kind==='weight'?'kg':kind==='heart'?'bpm':''};
  }
  function slot(direction, phase, limited=false, minimal=false, leading=false) {
    let content, label;
    const chosen=selected(direction);
    if (phase === 'stale') { content=phaseIcon(phase); label=phases.stale; }
    else if (phase === 'paused' && (minimal || leading)) { content=phaseIcon(phase); label='운동 일시 정지'; }
    else if (leading) { content=phase==='paused'?phaseIcon(phase):icon(chosen.symbol,chosen.kind==='heart'?'ls-heart':''); label=chosen.name; }
    else if (chosen.kind==='heart' && phase==='running') {
      content=minimal ? `<span class="ls-heart-stack">${icon('heart','ls-heart')}<span>142</span></span>` : '142';
      label='심박수 142 bpm';
    } else if (chosen.kind==='distance'||chosen.kind==='weight') {
      const value=chosen.kind==='distance'&&limited?Number(state.distance).toFixed(1):chosen.value;
      content=(limited||minimal)?`<span class="ls-value-stack"><span>${value}</span><small>${chosen.unit}</small></span>`:`${value} ${chosen.unit}`;
      label=`${chosen.name} ${chosen.value} ${chosen.unit}`;
    } else {
      const t=times(); content=limited?t.short:minimal?t.minimal:t.full;
      label=`${phase==='paused'?'일시 정지, ':''}경과 시간 ${t.spoken}`;
    }
    return `<span class="ls-slot${limited?' ls-short':''}" role="img" aria-label="${label}">${content}</span>`;
  }
  function minimal(direction, phase, limited=false) {
    if(phase==='ended') return '<span class="ls-ended-mark">제거됨</span>';
    return `<div class="ls-minimal${limited?' ls-tiny':''}">${slot(direction,phase,limited,true)}</div>`;
  }
  function compact(direction, limited=false) {
    if(state.phase==='ended') return `<div class="ls-removed">${icon('check')}<span>DUNE 액티비티 제거</span></div>`;
    return `<div class="ls-capsule${limited?' ls-limited':''}">${slot(direction,state.phase,limited,false,true)}<span class="ls-camera" aria-label="시스템 카메라 영역"></span>${state.phase==='stale'?'':slot(direction,state.phase,limited)}</div>`;
  }
  function header() {
    const name=state.longName?'체스트 프레스 머신 · 플레이트 로드':state.sport==='strength'?'벤치 프레스 · 3세트':'실외 달리기';
    return `<div class="ls-activity-heading"><span class="ls-phase-symbol">${phaseIcon(state.phase)}</span><div><div class="ls-title">${name}</div><div class="ls-brandline"><span class="ls-brand">DUNE</span><span>· ${phases[state.phase]}</span></div></div></div>`;
  }
  function metrics(includeHeart=true, excludeSport=false) {
    const sportMetric=state.sport==='cardio'?(state.distance==='missing'?'':`<span class="ls-metric">${icon('map-pin')}${Number(state.distance).toFixed(2)} <small>km</small></span>`):(state.weight==='missing'?'':`<span class="ls-metric">${icon('dumbbell')}${state.weight} <small>kg · 현재 세트</small></span>`);
    return `<div class="ls-metrics">${includeHeart&&state.heart?`<span class="ls-metric">${icon('heart')}142 <small>bpm</small></span>`:''}<span class="ls-metric">${icon('flame')}186 <small>kcal</small></span>${excludeSport?'':sportMetric}</div>`;
  }
  function detail(direction, type) {
    if(state.phase==='ended') return `<div class="ls-removed">${icon('check')}<span>종료 후 액티비티 제거<br>완료 카드를 남기지 않음</span></div>`;
    const chosen=selected(direction);
    const primaryHeart=chosen.kind==='heart'&&state.phase==='running';
    const glam=direction==='glam';
    let content=header();
    if(state.phase==='stale') content+=`<div class="ls-waiting">${icon('watch')}<span>Watch 데이터를 기다려요.</span></div>`;
    else if(primaryHeart) content+=`<div class="ls-primary-heart">${icon('heart')}142 <small>bpm</small></div><div class="ls-secondary-time">경과 ${times().full}</div>${metrics(false)}`;
    else if(chosen.kind==='distance'||chosen.kind==='weight') content+=`<div class="ls-selected-value" aria-label="${chosen.name}">${chosen.value}<small>${chosen.unit}</small></div><div class="ls-secondary-time">${chosen.name}${state.phase==='paused'?' · 일시 정지':''} · 경과 ${times().full}</div>${metrics(true,true)}`;
    else content+=`<div class="ls-big-time">${times().full}</div>${metrics()}`;
    if(glam&&state.phase!=='stale') {
      const value=primaryHeart?`<div class="ls-primary-heart">142 <small>bpm</small></div>`:chosen.kind==='distance'||chosen.kind==='weight'?`<div class="ls-selected-value">${chosen.value}<small>${chosen.unit}</small></div>`:`<div class="ls-big-time">${times().full}</div>`;
      const caption=state.phase==='paused'?'일시 정지 · 마지막 수치':chosen.name;
      content=header()+`<div class="ls-impact-main"><div><div class="ls-impact-kicker">${caption}</div>${value}</div><div class="ls-impact-emblem" aria-hidden="true">${icon(state.sport==='strength'?'dumbbell':'footprints')}</div></div>${chosen.kind==='time'?'':`<div class="ls-secondary-time">경과 ${times().full}</div>`}${metrics(!primaryHeart,chosen.kind==='distance'||chosen.kind==='weight')}`;
    }
    return `<div class="${type==='expanded'?'ls-island-expanded':type==='small'?'ls-lock ls-small':'ls-lock'}${state.phase==='paused'?' ls-subdued':''}" aria-label="${phases[state.phase]} ${type}">${type==='expanded'?'<div class="ls-island-camera" aria-label="시스템 카메라 영역"></div>':''}${content}</div>`;
  }
  function tile(title,spec,preview,note,tall=false) {
    return `<article class="ls-tile"><div class="ls-tile-top"><h4>${title}</h4><span class="ls-spec">${spec}</span></div><div class="ls-preview${tall?' ls-tall':''}">${preview}</div><div class="ls-tile-note">${note}</div></article>`;
  }
  function syncStageHeights() {
    const panels=[...root.querySelectorAll('[data-variant]')];
    panels.forEach(panel=>{panel.querySelector('.ls-stage').style.minHeight='0px';});
    const height=Math.max(...panels.map(panel=>{
      const hidden=panel.hidden;panel.hidden=false;
      const height=panel.querySelector('.ls-stage').getBoundingClientRect().height;
      panel.hidden=hidden;return height;
    }));
    panels.forEach(panel=>{panel.querySelector('.ls-stage').style.minHeight=`${Math.ceil(height)}px`;});
  }
  function render() {
    const sportMetric=state.sport==='cardio'?'distance':'weight';
    const primaryOptions=[['time','시간'],[sportMetric,state.sport==='cardio'?'거리 (km)':'현재 세트 중량 (kg)'],['heart','심박']];
    root.querySelector('#ls-sport').value=state.sport;
    root.querySelector('#ls-primary').innerHTML=primaryOptions.map(([value,name])=>`<option value="${value}">${name}</option>`).join('');
    root.querySelector('#ls-primary').value=preference();
    root.querySelector('#ls-data-label').textContent=state.sport==='cardio'?'거리 데이터':'현재 세트 입력 중량';
    const dataOptions=state.sport==='cardio'?[['4.2','4.20 km'],['42.2','42.20 km'],['0','0.00 km'],['missing','미수신 → 시간']]:[['60','60 kg · 3세트'],['12.5','12.5 kg · 3세트'],['0','0 kg · 입력값'],['missing','미입력 → 시간']];
    root.querySelector('#ls-data').innerHTML=dataOptions.map(([value,name])=>`<option value="${value}">${name}</option>`).join('');
    root.querySelector('#ls-data').value=state[sportMetric];
    root.dataset.appearance=state.appearance; root.dataset.large=String(state.large);
    root.dataset.longTime=String(state.duration>=3600);
    root.querySelector('#ls-appearance').value=state.appearance;root.querySelector('#ls-large').value=state.large?'yes':'no';root.querySelector('#ls-name').value=state.longName?'long':'short';
    root.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.phase===state.phase)));
    root.querySelector('#ls-duration').value=String(state.duration);root.querySelector('#ls-heart').value=state.heart?'yes':'no';
    root.querySelectorAll('[data-direction]').forEach(stage=>{
      const direction=stage.dataset.direction;
      const chosen=selected(direction),heartView=chosen.kind==='heart';
      const metricSummary=chosen.kind==='time'?'경과 '+times().minimal:`${chosen.name} ${chosen.value} ${chosen.unit}`;
      const smallMinimal=state.phase==='ended'?'':slot(direction,state.phase,false,true);
      const attached=`<div class="ls-attached">${smallMinimal}<span class="ls-camera" aria-label="시스템 카메라 영역"></span></div>`;
      const context=`<div class="ls-context"><div class="ls-context-label"><span>사진 상황 · 음악과 동시 표시</span><span>시스템 배치 예시</span></div><div class="ls-system-bar"><span class="ls-system-clock">08:54</span>${attached}<div class="ls-player" aria-label="다른 앱 음악 재생"><span class="ls-art"></span>${icon('audio-lines')}</div><span class="ls-status-icons">${icon('signal')}${icon('battery-full')}</span></div><div class="ls-context-caption">${state.phase==='ended'?'DUNE 표시는 제거되고 다른 활동만 유지':state.phase==='stale'?'연결 대기 · 오래된 수치 숨김':state.phase==='paused'?'정지 기호로 운동 상태를 먼저 구분':(chosen.missing?'선택 지표 미수신 → ':'핵심 정보: ')+metricSummary}</div></div>`;
      const chosenNote=chosen.kind==='distance'?'누적 거리와 km 단위. 좁은 폭은 소수 한 자리.':chosen.kind==='weight'?'현재 세트의 입력 중량과 kg 단위. 소수 중량도 유지.':heartView?'심장 기호와 심박수.':'경과 시간. 좁은 폭은 분·시간 축약.';
      const tiles=[
        tile('Compact','일반 폭 · 좌우 표시',compact(direction),chosenNote),
        tile('Compact · 제한 폭','내용 각 28 × 28pt',compact(direction,true),chosenNote),
        tile('Minimal','일반 / 제한 폭',`<div class="ls-size-pair">${minimal(direction,state.phase)}<span>36.67–45pt</span></div><div class="ls-size-pair">${minimal(direction,state.phase,true)}<span>28pt</span></div>`,chosenNote+' 정지·연결 대기는 상태 우선.'),
        tile('Expanded','길게 누름 · 가변 높이',detail(direction,'expanded'),'운동명·DUNE·상태와 시간·지표. 시스템 검은 표면 유지.',true),
        tile('잠금 화면','기본 family',detail(direction,'lock'),'기존 따뜻한 표면. 값 미수신과 실제 0을 구분.',true),
        tile('Small','Watch / CarPlay · 배치 연구',detail(direction,'small'),'작은 family용 정보 순서. 실제 호스트 크기는 별도 검증.',true)
      ].join('');
      stage.innerHTML=`<div class="ls-variant-head"><h3>${direction==='glam'?'골드 임팩트':direction==='time'?'내 선택 · '+primaryOptions.find(([key])=>key===preference())[1]:'심박 우선'}</h3><span>${direction==='glam'?'큰 수치 · 입체 심벌 · 골드 능선':direction==='time'?(state.sport==='cardio'?'유산소':'웨이트')+' · 종목별 취향':'비교안 · 실시간 강도 확인'}</span></div>${context}<div class="ls-grid">${tiles}</div><div class="ls-status-sweep" aria-label="상태별 minimal 비교">${Object.keys(phases).map(p=>`<div class="ls-status-cell" aria-current="${state.phase===p}">${minimal(direction,p)}<span>${phases[p]}</span></div>`).join('')}</div>`;
    });
    if(globalThis.lucide) lucide.createIcons({attrs:{width:18,height:18,'stroke-width':1.8}});
    syncStageHeights();
  }
  function persist() {
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{study:'WLA01 종목별 표시 선택',phase:state.phase,sport:state.sport,cardioMetric:state.cardioMetric,strengthMetric:state.strengthMetric},privateContent:{...state}}).catch(()=>{});
  }
  function restore(saved) {
    if(!saved?.privateContent) return;
    const s=saved.privateContent;
    if(Object.hasOwn(phases,s.phase)) state.phase=s.phase;
    if([45,1394,4845,43320].includes(s.duration)) state.duration=s.duration;
    if(typeof s.heart==='boolean') state.heart=s.heart;
    if(['light','dark'].includes(s.appearance)) state.appearance=s.appearance;
    if(typeof s.large==='boolean') state.large=s.large;
    if(typeof s.longName==='boolean') state.longName=s.longName;
    if(['cardio','strength'].includes(s.sport)) state.sport=s.sport;
    if(['time','distance','heart'].includes(s.cardioMetric)) state.cardioMetric=s.cardioMetric;
    if(['time','weight','heart'].includes(s.strengthMetric)) state.strengthMetric=s.strengthMetric;
    if(['4.2','42.2','0','missing'].includes(s.distance)) state.distance=s.distance;
    if(['60','12.5','0','missing'].includes(s.weight)) state.weight=s.weight;
  }
  function changed() {render();persist();root.querySelector('.ls-announcement').textContent=`${phases[state.phase]}, 경과 ${times().spoken}, 심박 ${state.heart?'142 bpm':'미수신'}`;}
  root.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{state.phase=b.dataset.phase;changed();}));
  root.querySelector('#ls-duration').addEventListener('change',e=>{state.duration=Number(e.target.value);changed();});
  root.querySelector('#ls-heart').addEventListener('change',e=>{state.heart=e.target.value==='yes';changed();});
  root.querySelector('#ls-sport').addEventListener('change',e=>{state.sport=e.target.value;changed();});
  root.querySelector('#ls-primary').addEventListener('change',e=>{state[state.sport==='cardio'?'cardioMetric':'strengthMetric']=e.target.value;changed();});
  root.querySelector('#ls-data').addEventListener('change',e=>{state[state.sport==='cardio'?'distance':'weight']=e.target.value;changed();});
  root.querySelector('#ls-appearance').addEventListener('change',e=>{state.appearance=e.target.value;changed();});
  root.querySelector('#ls-large').addEventListener('change',e=>{state.large=e.target.value==='yes';changed();});
  root.querySelector('#ls-name').addEventListener('change',e=>{state.longName=e.target.value==='long';changed();});
  restore(window.openai?.widgetState);render();
  let previousWidth=0;
  new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(Math.abs(width-previousWidth)>.5){previousWidth=width;syncStageHeights();}}).observe(root);
  window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:changed});
    tweak.addSelect(state,'appearance',{label:'표면',options:[{label:'밝음',value:'light'},{label:'어두움',value:'dark'}]});
    tweak.addToggle(state,'large',{label:'본문 큰 글씨'});
    tweak.addToggle(state,'longName',{label:'긴 근력 운동명'});
  } else {
    root.querySelector('#ls-fallback-controls').hidden=false;
  }
})();
</script>
