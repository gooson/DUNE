const headingLink=(title,route,glyph='',cls='',label='')=>`<button type="button" class="heading-link cursor-interaction ${cls}" data-route="${route}" aria-label="${label||title+' 상세 보기'}"><span class="heading-title">${glyph?icon(glyph):''}<span class="heading-text">${title}</span>${chevron()}</span></button>`;
const section=(id,title,glyph,body,tail='')=>{const route=!session.route&&sectionRoutes[id];return `<section class="surface" data-section="${id}"><div class="section-head">${route?`<h2 class="section-heading">${headingLink(title,route,glyph)}</h2>`:`<div class="label">${icon(glyph)}<h2>${title}</h2></div>`}${tail}</div>${body}</section>`;};

const hasScore=()=>!['empty','denied','loading','calibrating'].includes(state.data);
const hasRecords=()=>!['empty','denied','loading'].includes(state.data);
const chart=(values,color='var(--a-gold)',label='최근 7일 준비도')=>{const segs=[];let seg=[];values.forEach((v,i)=>{if(v===null){if(seg.length)segs.push(seg);seg=[];}else seg.push([8+i*44,46-v*.38]);});if(seg.length)segs.push(seg);return `<svg class="spark" viewBox="0 0 280 50" preserveAspectRatio="none" role="img" aria-label="${esc(label+': '+values.map(v=>v===null?'기록 없음':v+'점').join(', '))}"><path d="M8 45 H272" stroke="currentColor" opacity=".15" fill="none"/>${segs.map(s=>s.length>1?`<polyline points="${s.map(p=>p.join(',')).join(' ')}" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:'').join('')}${values.map((v,i)=>v===null?'':`<circle cx="${8+i*44}" cy="${46-v*.38}" r="${i===6?3:2}" fill="${color}"/>`).join('')}</svg>`};
function ring(){const s=state.score,arc=s===0?'':`<circle cx="52" cy="52" r="48.5" fill="none" stroke="#e4bc6b" stroke-width="7" stroke-linecap="${s===100?'butt':'round'}" pathLength="100" stroke-dasharray="${s} 100" transform="rotate(-90 52 52)"/>`;return `<div class="ring" role="img" aria-label="운동 준비도 ${s}점"><svg viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="48.5" fill="none" stroke="#baa378" opacity=".22" stroke-width="7"/>${arc}</svg><strong aria-hidden="true">${s}</strong></div><div class="external-score"><span class="score-label">운동 준비도</span><span class="score-value">${s}<small>점</small></span></div>`;}
function hero(design){
 if(!hasScore()){
  const title={empty:'운동 준비도를 알아가는 중',denied:'건강 기록을 연결해 주세요',loading:'운동 기록을 불러오는 중',calibrating:'나의 기준선을 만드는 중'}[state.data];
  const copy={empty:'수면과 HRV 기록이 쌓이면 준비도와 변화를 함께 볼 수 있어요.',denied:'Apple Health 접근을 허용하면 준비도와 운동 기록을 함께 볼 수 있어요.',loading:'준비도를 확인하고 있어요. 운동은 상단 +에서 선택할 수 있어요.',calibrating:'기록은 모으고 있어요. 기준선이 준비되면 점수를 표시해요.'}[state.data];
  return `<section class="surface hero" data-section="readiness"><div class="hero-top"><span class="eyebrow">READINESS</span></div><div class="hero-title">${title}</div><p class="hero-copy">${copy}</p>${state.data==='loading'?'<div class="placeholder"></div><div class="placeholder short"></div>':''}${state.data==='denied'?action('건강 접근 안내','permissions'):''}</section>`;
 }
 const status=state.score>=80?'운동하기 좋은 흐름':state.score>=60?'평소의 운동을 이어가도 좋아요':'회복 흐름을 살펴보세요';
 const message=state.data==='partial'?'HRV는 평소보다 낮아요. 수면 기록은 아직 기다리고 있어요.':state.score>=80?'수면과 HRV가 평소 범위에 있어요.':state.score>=60?'HRV는 평소보다 낮고, 수면은 충분해요.':'준비도가 평소보다 낮아요. 강도와 회복을 함께 살펴보세요.';
 const evidence=`<div class="evidence" aria-label="준비도 구성 점수"><div class="evidence-heading"><span>준비도 근거</span><span>100점 기준</span></div>${[['HRV',64],['수면',state.data==='partial'?null:83],['회복',72]].map(([name,value])=>`<div class="evidence-row ${value===null?'missing':''}" data-evidence="${name}" role="img" aria-label="${name} 구성 점수 ${value===null?'기록 없음':value+'점, 100점 기준'}"><span class="evidence-label" aria-hidden="true">${name}</span><div class="evidence-track" aria-hidden="true">${value===null?'':`<i style="width:${value}%"></i>`}</div><strong aria-hidden="true">${value===null?'—':value+'<small> /100</small>'}</strong></div>`).join('')}</div>`;
 const trend=state.data==='single'?'<p class="hero-copy rule">10.26 첫 기록 · 다음 기록부터 변화를 볼 수 있어요.</p>':`<div class="trend-head"><span>저장된 준비도 · 최근 7일</span><span>점수 /100</span></div>${chart([62,68,state.data==='partial'?null:65,76,73,69,state.score],'#e4bc6b')}<div class="axis"><span>10.20</span><span>10.26 · ${state.score}점</span></div>`;
 return `<section class="surface hero" data-section="readiness"><div class="hero-top">${!session.route?headingLink('READINESS','readiness','','eyebrow','운동 준비도 상세 보기'):'<span class="eyebrow">READINESS</span>'}<span class="small muted">10.26 · 오늘</span></div><div class="hero-row"><div>${ring()}</div><div><div class="hero-title">${status}</div><p class="hero-copy">${message}</p></div></div>${evidence}${design==='training'?`<details><summary>7일 변화와 근거${chevron()}</summary>${trend}<p>구성 수치는 각 항목의 100점 기준 점수예요. HRV 실측값이나 수면 시간과 구분해요.</p></details>`:trend}</section>`;
}

function records(){return section('records','개인 기록','trophy',`<div class="records-summary"><span>${icon('star')}Lv.4</span><span>${icon('medal')}배지 3개</span><span>340포인트</span></div><div class="split"><article class="record-item"><div class="record-top"><span class="record-medallion">${icon('trophy')}</span><span class="record-new">NEW BEST</span></div><div class="record-title">Squat</div><div class="record-kind">최고 중량</div><div class="value">80<small>kg</small></div><div class="record-improvement">이전 최고보다 +5kg</div><div class="record-foot"><span>10.21 기록</span><span>직접 기록</span></div></article><article class="record-item"><div class="record-top"><span class="record-medallion">${icon('medal')}</span><span class="record-new">NEW BEST</span></div><div class="record-title">Running</div><div class="record-kind">최고 페이스</div><div class="value">5:14<small>/km</small></div><div class="record-improvement">이전 최고보다 14초 단축</div><div class="record-foot"><span>10.23 기록</span><span>Apple Health</span></div></article></div>`);}
const achievementEvents=[{kind:'flag',title:'운동 20회 달성',detail:'누적 운동 20회',date:'10.25',points:30},{kind:'trophy',title:'페이스 개인 기록',detail:'Running · 5:14/km',date:'10.23',points:40},{kind:'medal',title:'꾸준한 시작 배지',detail:'근력 운동 10회',date:'10.21',points:20},{kind:'star',title:'레벨 4 도달',detail:'운동 기록으로 쌓은 포인트',date:'10.18',points:0}];
function achievementRows(all=false){return `<div class="achievement-list">${achievementEvents.slice(0,all?4:3).map(x=>`<div class="achievement-row">${icon(x.kind)}<div><div class="achievement-name">${x.title}</div><div class="achievement-meta"><span>${x.date}</span><span>${x.detail}</span></div></div>${x.points?`<span class="achievement-points">+${x.points}포인트</span>`:''}</div>`).join('')}</div>`;}
function achievement(all=false){return section('achievement','달성 이력','medal',achievementRows(all));}
function consistency(monthlyFirst=false){const streak=`<div class="split"><div><div class="small muted">현재 연속 운동</div><div class="value">1<small>일</small></div></div><div><div class="small muted">최고 연속 운동</div><div class="value">5<small>일</small></div></div></div>`;const monthly=`<div><div class="axis"><span>10월 운동일 목표</span><span>10 / 16일</span></div><div class="progress" role="progressbar" aria-label="10월 운동일 목표" aria-valuemin="0" aria-valuemax="16" aria-valuenow="10"><i style="width:62.5%"></i></div><div class="weekdays" aria-label="최근 7일 중 수·금·일 운동">${['화','수','목','금','토','일','월'].map((d,i)=>`<span class="${[1,3,5].includes(i)?'active':''}">${d}<i></i></span>`).join('')}</div></div>`;return section('consistency','운동 꾸준함','flame',monthlyFirst?monthly+`<div class="rule">${streak}</div>`:streak+`<div class="rule">${monthly}</div>`);}
function mix(){return section('mix','운동 구성','chart-no-axes-column',`<div class="mix-period"><span>최근 28일</span><span>운동 횟수 기준</span></div><div class="mix-overview">${[{kind:'strength',icon:'dumbbell',name:'근력',percent:68},{kind:'cardio',icon:'footprints',name:'유산소',percent:32}].map(x=>`<div class="mix-category ${x.kind}"><div class="mix-category-title"><span class="mix-icon">${icon(x.icon)}</span><span>${x.name}</span></div><div class="mix-percent"><strong>${x.percent}</strong><small>%</small></div></div>`).join('')}</div><div class="mix" role="img" aria-label="최근 28일 운동 횟수 구성: 근력 68%, 유산소 32%. 금빛은 근력, 녹색은 유산소."><i></i><i></i></div><div class="mix-muscles"><span class="mix-muscles-label">${icon('person-standing')}주요 근력 부위</span><span class="mix-muscle-tag">하체</span><span class="mix-muscle-tag">등</span></div>`);}
function emptyContent(){if(state.data==='loading')return section('loading','건강 기록 확인 중','loader',`<div class="placeholder"></div><div class="placeholder short"></div><p class="small muted">운동 선택은 상단 +에서 열 수 있어요.</p>`);return section('start','운동 기록을 시작해 보세요','dumbbell',`<p class="empty-copy">${state.data==='denied'?'건강 접근을 허용하거나 직접 운동을 기록할 수 있어요.':'운동 기록이 쌓이면 주간 통계와 근육 회복을 함께 볼 수 있어요.'}</p>${action('운동 선택','picker')}${action('내 템플릿','templates')}`);}
function dashboard(){if(!hasRecords())return hero('training')+emptyContent();return hero('training')+`<div class="wide-pair"><div class="flow-stack">${muscle()}${risk()}</div>${suggested()}</div>`+recent()+`<div class="wide-pair">${records()}${achievement()}</div><div class="wide-pair">${stats()}${report()}</div><div class="wide-pair">${consistency(true)}${volume()}</div>`+mix();}
function destination(){const route=session.route,back='<button type="button" class="back cursor-interaction" data-back>'+icon('chevron-left')+'Activity</button>';let body='';
 if(route==='readiness')body=section('readiness-detail','운동 준비도','activity',`<div class="value">${state.score}<small>/100</small></div><p class="report-copy">HRV·수면·회복을 함께 살펴본 점수예요. 각 구성 점수는 100점 기준이에요.</p>${hero('compact')}`);
 else if(route==='muscle')body=section('muscle-detail','부위별 근육 회복','person-standing',`${muscle()}<p class="empty-copy">최근 운동일과 부위별 회복 기록을 함께 확인해요.</p>${['가슴 · 최근 10.25 · 회복 중','어깨 · 최근 10.25 · 회복 중','하체 · 최근 10.21 · 회복 완료'].map(x=>`<div class="rule">${x}</div>`).join('')}`);
 else if(['picker','templates'].includes(route))body=section('picker','운동 선택','dumbbell',exerciseRows(exercises)+action('내 상체 루틴','template:내 상체 루틴'));
 else if(route.startsWith('exercise:')||route.startsWith('template:')){const name=route.split(':').slice(1).join(':');body=section('exercise-start',esc(name),'dumbbell',`<p class="empty-copy">운동 구성과 목표를 확인해요.</p><div class="rule">${route.startsWith('template:')?'Squat · Row · Press':'3세트 · 10회'}</div><button type="button" class="primary cursor-interaction" data-preview-start>이 구성으로 시작${icon('arrow-right')}</button><p class="small muted" data-start-result role="status"></p>`);}
 else if(route==='equipment')body=section('equipment','사용할 장비','sliders-horizontal',`<p class="empty-copy">${session.context==='gym'?'헬스장':'집'}에서 사용할 장비를 선택해요.</p>${['맨몸','덤벨','케이블'].map((x,i)=>`<label class="workout-row"><input type="checkbox" ${i<2?'checked':''}>${x}</label>`).join('')}<button type="button" class="primary cursor-interaction" data-back>선택 완료${icon('check')}</button>`);
 else if(route==='permissions')body=section('permissions','Apple Health 접근','heart-pulse','<p class="empty-copy">설정에서 HRV·수면·운동의 읽기 접근을 허용하면 기록을 함께 볼 수 있어요.</p>');
 else if(route==='ai')body=section('builder','AI 운동 만들기','sparkles','<p class="empty-copy">운동 목표, 장소와 장비를 바탕으로 루틴을 구성해요.</p><label class="workout-row"><input type="radio" name="goal" checked>전신 근력</label><label class="workout-row"><input type="radio" name="goal">회복 중심</label><button type="button" class="primary cursor-interaction" data-preview-start>구성 미리보기</button><p class="small muted" data-start-result role="status"></p>');
 else if(route==='stats')body=stats();else if(route==='volume')body=volume();else if(route==='report')body=report();else if(route==='records')body=records();else if(route==='achievements')body=section('achievement-destination','개인 기록','trophy',`<div class="medal">${icon('award')}레벨 4 · 340포인트</div>`+`<h3 class="rule">달성 이력 · 2026년 10월</h3><div class="rule">${achievementRows(true)}</div>`);else if(route==='consistency')body=consistency();else if(route==='mix')body=mix();
 else if(route==='risk')body=section('risk-detail','훈련 부담','shield-check',riskBody(true),riskStatus());
 else if(route.startsWith('history:')){const x=recentWorkouts.find(w=>w.id===route.slice(8));body=x?section('history-detail',x.name,x.icon,`<div class="recent-meta"><span>${x.date}</span><span>${x.source==='manual'?'직접 기록':'HealthKit 기록'}</span></div><div class="value">${x.metric}</div><div class="recent-meta">${recentHeart(x)}${recentSync(x)}</div>${recentBadges(x)}`):section('history-missing','운동 기록','history','<p class="empty-copy">이 기록을 찾을 수 없어요.</p>');}
 else body=section('tab-preview',route,'layout-grid','<p class="empty-copy">이번 시안은 Activity 화면의 흐름을 살펴봐요.</p>');
 return `<div class="detail-page">${back}${body}</div>`;
}
function chrome(){return `<div class="dunes" aria-hidden="true"><div class="dune-layer far"></div><div class="dune-layer mid"></div><div class="dune-layer near"></div></div><div class="chrome"><div class="status"><span>9:41</span><span class="island" aria-hidden="true"></span><span class="signals">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><header class="titlebar"><div><h1>Activity</h1><div class="date">10월 26일 월요일</div></div><button type="button" class="round cursor-interaction" data-route="picker" aria-label="운동 선택">${icon('plus')}</button></header></div>`;}
function nav(){return `<nav class="bottomnav" aria-label="주요 탭">${[['clipboard-heart','Today'],['flame','Activity'],['leaf','Wellness'],['list-checks','Life']].map(([i,n])=>`<button type="button" class="navitem cursor-interaction ${n==='Activity'?'selected':''}" ${n==='Activity'?'aria-current="page" data-back':`data-route="${n}"`}>${icon(i)}${n}</button>`).join('')}</nav><div class="home" aria-hidden="true"></div>`;}
function sizeStages(){const phone=root.querySelector('.phone');if(phone)root.style.setProperty('--activity-stage',phone.getBoundingClientRect().height+44+'px');}
function render(save=false){state.text=Math.max(100,Math.min(200,Number(state.text)||100));state.width=Math.max(320,Math.min(1032,Number(state.width)||402));state.score=Math.max(0,Math.min(100,Math.round(Number(state.score)||0)));root.style.setProperty('--activity-type',state.text/100);root.style.setProperty('--activity-width',state.width+'px');
 root.querySelectorAll('.phone').forEach(p=>{p.dataset.mode=['light','dark'].includes(state.appearance)?state.appearance:'auto';p.classList.toggle('large',state.text>=130);p.innerHTML=chrome()+`<main>${session.route?destination():dashboard()}</main>`+nav();});
 const layers=[{name:'far',center:45,amplitude:8,frequency:.72,skew:.2},{name:'mid',center:62,amplitude:10,frequency:1,skew:.18},{name:'near',center:76,amplitude:13,frequency:1.35,skew:.14}];layers.forEach(l=>{const points=[];for(let x=0;x<=400;x+=5){const a=Math.PI*2*l.frequency*x/400,y=l.center+l.amplitude*(Math.sin(a)+l.skew*Math.sin(2*a+Math.PI/6));points.push(`${x/4}% ${y/2.2}%`);}root.querySelectorAll('.dune-layer.'+l.name).forEach(e=>e.style.clipPath=`polygon(${points.join(',')},100% 100%,0 100%)`);});
 if(globalThis.lucide)lucide.createIcons();requestAnimationFrame(sizeStages);if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{activityFinalDesign:state}}).catch(()=>{});
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.closest('.phone');if(!p)return;
 if(b.hasAttribute('data-route')){session.returnFocus=b.dataset.route;session.route=b.dataset.route;render();const next=p.querySelector('.back');if(next)next.focus({preventScroll:true});p.scrollIntoView({block:'start',behavior:'instant'});}
 else if(b.hasAttribute('data-back')){session.route=null;render();const focus=[...p.querySelectorAll('[data-route]')].find(x=>x.dataset.route===session.returnFocus);if(focus)focus.focus({preventScroll:true});}
 else if(b.hasAttribute('data-map')){session.map=b.dataset.map;root.querySelectorAll('.phone').forEach(phone=>{phone.querySelectorAll('[data-section=muscle]').forEach(s=>{const box=document.createElement('div');box.innerHTML=muscle();s.replaceWith(box.firstElementChild);});});if(globalThis.lucide)lucide.createIcons();sizeStages();}
 else if(b.hasAttribute('data-context')){session.context=b.dataset.context;root.querySelectorAll('.phone [data-context]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.context===session.context)));updateResults();}
 else if(b.hasAttribute('data-preview-start')){const result=b.closest('.surface').querySelector('[data-start-result]');if(result)result.textContent='시안에서 구성을 확인했어요. 실제 운동은 시작되지 않아요.';}
});
function updateResults(){root.querySelectorAll('[data-exercise-results]').forEach(el=>el.innerHTML=suggestionResults());if(globalThis.lucide)lucide.createIcons();requestAnimationFrame(sizeStages);}
root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){session.query=e.target.value;root.querySelectorAll('[data-search]').forEach(x=>{if(x!==e.target)x.value=session.query;});updateResults();}});
root.addEventListener('toggle',()=>requestAnimationFrame(sizeStages),true);
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent?.activityFinalDesign;if(s){Object.assign(state,s);render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{session.route=null;render(true);}});tweak.addSelect(state,'appearance',{label:'화면 모드',options:[{label:'시스템',value:'auto'},{label:'밝게',value:'light'},{label:'어둡게',value:'dark'}]});tweak.addSlider(state,'text',{label:'글자 크기',min:100,max:200,step:5,unit:'%'});tweak.addSlider(state,'width',{label:'최대 화면 폭',min:320,max:1032,step:2,unit:'pt'});tweak.addSelect(state,'data',{label:'기록 상태',options:[{label:'기록 충분',value:'complete'},{label:'일부 누락',value:'partial'},{label:'첫 준비도 기록',value:'single'},{label:'기준선 형성 중',value:'calibrating'},{label:'기록 없음',value:'empty'},{label:'건강 접근 필요',value:'denied'},{label:'처음 불러오는 중',value:'loading'}]});tweak.addSlider(state,'score',{label:'준비도 점수',min:0,max:100,step:1});tweak.addToggle(state,'restDay',{label:'휴식일'});}
})();
</script>
