#wellness-redesign .assessment-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#wellness-redesign .phone .primary{background:var(--w-gold);color:var(--w-surface);border-radius:12px;padding:10px 14px;min-height:44px;font-size:calc(12px * var(--w-type));font-weight:600}

#wellness-redesign .navitem{padding:5px 2px;min-height:51px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:11px;border-radius:24px;color:var(--w-muted)}#wellness-redesign .navitem.selected{background:var(--w-inset);color:var(--w-gold);font-weight:650}

#wellness-redesign .phone.large .hero-row{display:block}#wellness-redesign .phone.large .ring{display:none}#wellness-redesign .phone.large .external-score{display:block}

<div id="wellness-redesign" aria-label="웰니스 개편 시안">
  <div class="preview-label">개편 시안 · 예시 기록 · 앱 적용 전</div>
  <div class="viz-carousel viz-dotted-background" aria-label="웰니스 개편 방향" data-previous-label="이전 시안" data-next-label="다음 시안">
    <section data-variant="Flow" aria-label="Flow · 수면에서 몸의 변화로"><div class="stage"><div class="phone" data-design="flow" aria-label="Flow 웰니스"></div></div></section>
    <section data-variant="Compact" aria-label="Compact · 기존 순서 정돈" hidden><div class="stage"><div class="phone" data-design="compact" aria-label="Compact 웰니스"></div></div></section>
  </div>
</div>
<script>
(()=>{
const root=document.getElementById('wellness-redesign');
const defaults={appearance:'auto',width:402,text:100,data:'complete',score:79};
const saved=window.openai?.widgetState?.modelContent?.wellnessDesign;
const state={...defaults,...(saved&&typeof saved==='object'?saved:{})};
const routes=new Map();
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heading=(title,route,ic,extra='')=>`<div class="head"><h2>${route?`<button class="heading cursor-interaction" data-route="${route}">${ic?icon(ic):''}<span class="title"><span>${title}</span>${icon('chevron-right')}</span></button>`:`<span class="heading">${ic?icon(ic):''}<span>${title}</span></span>`}</h2>${extra}</div>`;
const action=(label,route)=>`<button class="text-action cursor-interaction" data-route="${route}"><span>${label}</span>${icon('chevron-right')}</button>`;
const summary=(label,content)=>`<details><summary>${label}${icon('chevron-right')}</summary>${content}</details>`;
const blank=()=>['empty','access','sync','loading'].includes(state.data);
const duration=m=>`${Math.floor(m/60)}시간 ${m%60}분`;
const samples=[398,420,435,405,441,430,432];
function spark(values,color='var(--w-gold)'){
 if(values.length<2)return '';
 const min=Math.min(...values),range=Math.max(...values)-min||1;
 const pts=values.map((v,i)=>`${2+i/(values.length-1)*296},${23-(v-min)/range*20}`).join(' ');
 return `<svg class="mini-chart" viewBox="0 0 300 26" preserveAspectRatio="none" role="img" aria-label="최근 기록 흐름. ${values.join(', ')}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;

function hero(design){

 else if(route.startsWith('injury'))body=state.data==='injury'?'<h3>오른쪽 어깨</h3><p class="detail-copy">10.25 시작 · 직접 기록</p>':'<p class="empty-copy">부위·시작일·경과를 남기는 입력 화면으로 이어져요.</p>';
 else if(route==='posture-history')body='<div class="value"><span>80</span><small>/100</small></div><p class="detail-copy">10.26 · 사진 자세 평가</p>';
 else if(route.startsWith('body-')){const a=[['체지방률','18.2','%'],['제지방량','55.9','kg'],['BMI','22.1','']][Number(route.slice(-1))];body=`<h3>${a[0]}</h3><div class="value"><span>${a[1]}</span><small>${a[2]}</small></div><p class="detail-copy">10.27 기록</p>`;}
 phone.innerHTML=`<div class="chrome"><button class="back cursor-interaction" data-back>${icon('chevron-left')}웰니스로</button></div><main class="detail-page"><h2>${escape(detailTitles[route]||m?.name||'신체 지표')}</h2><div class="surface">${body}</div></main>${nav()}`;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
 phone.querySelector('[data-back]').focus({preventScroll:true});phone.scrollIntoView({block:'start'});
}
root.addEventListener('click',e=>{
 const phone=e.target.closest('.phone');if(!phone)return;
 const back=e.target.closest('[data-back]');if(back){const prev=routes.get(phone);if(prev){phone.innerHTML=screen(phone.dataset.design);const target=phone.querySelector(`[data-route="${prev.route}"]`);target?.focus({preventScroll:true});window.scrollTo(0,prev.scrollY);routes.delete(phone);if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}return;}
 const button=e.target.closest('[data-route]');if(button&&!button.disabled)detail(phone,button.dataset.route);
});
root.addEventListener('submit',e=>{if(!e.target.matches('[data-record-form]'))return;e.preventDefault();e.target.querySelector('[data-confirmation]').textContent='입력 형식을 확인했어요. 실제 기록은 저장하지 않았어요.';});
root.addEventListener('toggle',equalize,true);
root.updatePreview=patch=>{Object.assign(state,patch);state.width=Math.max(280,Math.min(1100,Number(state.width)||402));state.text=Math.max(100,Math.min(200,Number(state.text)||100));render();};
root.previewState=state;
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(state,'appearance',{label:'밝기',options:[{label:'시스템',value:'auto'},{label:'밝음',value:'light'},{label:'어두움',value:'dark'}]});tweak.addSelect(state,'width',{label:'화면 폭',options:[{label:'작은 화면 · 320',value:320},{label:'iPhone · 402',value:402},{label:'Duo 접힘 · 466',value:466},{label:'Duo 펼침 · 951',value:951},{label:'iPad · 1032',value:1032}]});tweak.addSlider(state,'text',{label:'글씨 크기',min:100,max:200,step:25,unit:'%'});tweak.addSelect(state,'data',{label:'기록 상태',options:[{label:'기본 기록',value:'complete'},{label:'일부 조회 누락',value:'partial'},{label:'첫 수면 1일',value:'single'},{label:'신체 기록만',value:'body-only'},{label:'최근 기록 3일 전',value:'stale'},{label:'Watch 모니터링 꺼짐',value:'watch-off'},{label:'관리 중인 부상',value:'injury'},{label:'전체 기록 없음',value:'empty'},{label:'건강 기록 접근 확인',value:'access'},{label:'동기화 대기',value:'sync'},{label:'초기 로딩',value:'loading'}]});tweak.addSlider(state,'score',{label:'웰니스 예시 점수',min:0,max:100,step:1});}
window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.modelContent?.wellnessDesign;if(value)root.updatePreview(value);});
new ResizeObserver(()=>equalize()).observe(root);
})();
</script>
