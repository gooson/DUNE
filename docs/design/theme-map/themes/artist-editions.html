<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DUNE · 테마 시안</title>
    <link rel="stylesheet" href="assets/theme-editions/studio.css">
    <script defer src="assets/theme-editions/studio.js"></script>
  </head>
  <body>
    <main>
      <header class="mast">
        <div>
          <div class="brand">DUNE</div>
          <h1>테마 시안</h1>
          <p>네 탭과 공통 상세 화면 · 예시 데이터</p>
        </div>
        <div class="actions">
          <div class="switch" aria-label="밝기" role="group">
            <button data-mode="light">라이트</button>
            <button data-mode="dark">다크</button>
          </div>
          <button id="motion" class="plain" aria-controls="panels">움직임 멈추기</button>
        </div>
      </header>
      <div class="toolbar">
        <div class="switch" role="group" aria-label="비교 방식">
          <button data-view="all">전체 비교</button>
          <button data-view="focus">한 테마 보기</button>
        </div>
        <label id="theme-label">테마 <select id="theme"></select></label>
        <label>탭 <select id="tab"></select></label>
        <label>화면 <select id="scene"></select></label>
      </div>
      <div id="panels"></div>
      <noscript>화면을 전환하려면 자바스크립트를 켜 주세요.</noscript>
    </main>
  </body>
</html>
