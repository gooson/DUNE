<div id="theme-crest-language" class="viz-dotted-background">
  <style>
    #theme-crest-language { width:100%; display:grid; gap:18px; padding:10px 0 18px; }
    #theme-crest-language * { box-sizing:border-box; }
    #theme-crest-language .crest-scene { position:relative; height:154px; overflow:hidden; border-radius:26px; isolation:isolate; }
    #theme-crest-language .crest-scene svg { display:block; width:100%; height:100%; }
    #theme-crest-language .crest-name { position:absolute; z-index:2; left:24px; top:18px; color:#fff; font:500 14px/1.2 -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:.16em; text-shadow:0 1px 8px #0008; }
    #theme-crest-language .crest-word { position:absolute; z-index:2; left:24px; bottom:18px; color:#fff; font:500 22px/1.15 -apple-system,BlinkMacSystemFont,sans-serif; letter-spacing:-.03em; text-shadow:0 2px 12px #0009; }
    #theme-crest-language .crest-motion { transform-origin:center; animation:crest-breathe 11s ease-in-out infinite alternate; }
    #theme-crest-language .crest-motion.reversed { animation-direction:alternate-reverse; animation-duration:14s; }
    #theme-crest-language .crest-shine { animation:crest-shine 5s ease-in-out infinite alternate; }
    #theme-crest-language .crest-speck { animation:crest-float 12s ease-in-out infinite alternate; }
    #theme-crest-language .crest-ocean { background:#061c27; }
    #theme-crest-language .crest-dune { background:#3a2d26; }
    #theme-crest-language .crest-forest { background:#102c22; }
    #theme-crest-language .crest-sakura { background:#382537; }
    @keyframes crest-breathe { from { transform:translate(-9px,2px) scale(1.025); } to { transform:translate(9px,-3px) scale(1.025); } }
    @keyframes crest-shine { from { opacity:.42; } to { opacity:.92; } }
    @keyframes crest-float { from { transform:translate(-7px,9px); opacity:.34; } to { transform:translate(11px,-9px); opacity:.85; } }
    @media (prefers-reduced-motion:reduce) { #theme-crest-language .crest-motion, #theme-crest-language .crest-shine, #theme-crest-language .crest-speck { animation:none; } }
    @media (max-width:480px) { #theme-crest-language .crest-scene { height:142px; border-radius:21px; } #theme-crest-language .crest-name,#theme-crest-language .crest-word { left:18px; } }
  </style>
