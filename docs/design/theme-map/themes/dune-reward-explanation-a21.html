<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A21 보상 설명 · 구현 제안</title><h1>A21 보상 설명</h1><p>실제 앱 원본 캡처 준비 단계입니다. 개편 화면의 빌드·캡처 검증은 아직 수행하지 않았습니다.</p><h2>기존 보상 아이콘과 시스템 시트</h2><p>별·메달·트로피·깃발과 중간 높이 시스템 시트를 유지합니다. 불투명 제목 히어로와 아이콘별 설명 카드로 구성하고, 큰 글씨는 전체 본문 폭으로 줄바꿈·스크롤합니다.</p><p>보상·점수 계산은 유지하며 설명만 실제 계산 경로에 맞춥니다. 원본 화면을 먼저 보존하고 기기별 개편 캡처와 나란히 비교합니다.</p></html>
