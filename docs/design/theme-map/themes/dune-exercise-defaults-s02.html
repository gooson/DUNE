<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S02 direction mock — Exercise Defaults</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#24201d;background:#f9f7f4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f4ede7 0,#fbfaf8 250px,#fff 520px);min-height:100vh}
.phone{max-width:430px;min-height:932px;margin:0 auto;padding:52px 18px 32px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.back{border:1px solid #e6e0da;border-radius:50%;width:42px;height:42px;background:#ffffffb8;font-size:26px}.title{font-size:20px;font-weight:700}.spacer{width:42px}
h2{font-size:14px;letter-spacing:.02em;color:#8b837d;margin:22px 10px 10px}
.group{background:#fff;border-radius:22px;overflow:hidden}.row{min-height:55px;margin:0 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ece9e6}.row:last-child{border:0}
.glyph{width:28px;height:28px;border-radius:8px;color:#ba8964;background:#f8eee7;display:grid;place-items:center;flex:none;font-size:14px}.content{flex:1;min-width:0}.name{font-size:16px}.sub{font-size:12px;color:#928b84;margin-top:3px}.chev{color:#bbb5b0;font-size:24px}.badge{color:#ba8964;font-size:15px}
.note{color:#8d8781;font-size:12px;margin:10px 12px;line-height:1.45}.field{color:#24201d;text-align:right;font-size:16px;min-width:72px}.toggle{width:47px;height:29px;border-radius:20px;background:#cecdcb;position:relative;flex:none}.toggle:before{content:"";position:absolute;left:3px;top:3px;width:23px;height:23px;background:#fff;border-radius:50%}.save{border:1px solid #e5d3c5;background:#ffffffaa;border-radius:22px;padding:10px 16px;color:#ba8964;font-size:16px;font-weight:600}.danger{background:#fff;border-radius:20px;color:#d44a45;padding:16px 20px;margin-top:24px;font-size:15px}
.search{background:#fff;border-radius:12px;padding:9px 12px;color:#aaa3a0;font-size:14px;margin-bottom:18px}
@media(max-width:340px){.phone{padding-left:12px;padding-right:12px}}
</style>
<body><main class="phone"><header class="top"><button class="back" aria-label="Back">‹</button><div class="title">Exercise Defaults</div><div class="spacer"></div></header>
<div class="search">⌕ &nbsp; Search exercises</div>
<h2>Configured</h2><section class="group"><div class="row"><div class="glyph">▣</div><div class="content"><div class="name">바벨 벤치프레스</div><div class="sub">60 kg</div></div><div class="badge">★</div><div class="chev">›</div></div></section>
<h2>All Exercises</h2><section class="group">
<div class="row"><div class="glyph">↔</div><div class="content name">TRX 로우</div><div class="chev">›</div></div>
<div class="row"><div class="glyph">▣</div><div class="content name">TRX 체스트 프레스</div><div class="chev">›</div></div>
<div class="row"><div class="glyph">⌁</div><div class="content name">걷기</div><div class="chev">›</div></div>
<div class="row"><div class="glyph">▣</div><div class="content name">고블릿 스쿼트</div><div class="chev">›</div></div>
<div class="row"><div class="glyph">↔</div><div class="content name">굿모닝</div><div class="chev">›</div></div>
<div class="row"><div class="glyph">▣</div><div class="content name">글루트 브리지</div><div class="chev">›</div></div>
</section><p class="note">Design direction mock. The app keeps its native List, search, ordering, and actual SF Symbols.</p></main></body></html>
