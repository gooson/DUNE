<h1>Water Lilies · 동작 줄이기</h1>
<p>iOS 설정에서 동작 줄이기를 켠 뒤 UIKit에서 활성 상태를 확인했습니다. 앱으로 돌아온 뒤에도 컨디션 상세의 주간 차트 선택이 유지됐습니다.</p>
<p>복원 직후 iOS 설정 스위치는 꺼졌고, 같은 순간 UIKit은 이전 값을 읽었습니다.</p>
