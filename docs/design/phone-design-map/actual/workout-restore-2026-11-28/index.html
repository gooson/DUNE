<h1>운동 동기화 동의와 설정</h1><p>2026년 11월 28일, 전용 iPhone 18 Pro 시뮬레이터 · iOS 27.2. 임시 저장소에서 UI 검사 두 건이 통과했다.</p>
<main><figure><h2>T02 · iCloud 동기화 동의</h2><a href="../regular/images/T02.png"><img src="../regular/images/T02.png" alt="운동 라이브러리, Apple 건강, 이 기기에 보관 안내와 동기화 선택 버튼"></a><figcaption>영어로 실행해 세 안내 항목과 양쪽 선택 버튼을 확인하고 기기 보관을 선택했다.</figcaption></figure>
<figure><h2>S01 · 데이터 및 개인정보</h2><p>설정 캡처 원본은 검증 Mac의 XCTest 결과 번들에 보관했다.</p><figcaption>iCloud 동기화와 근처 기기 운동 동기화가 꺼진 상태에서 이전 백업 복구 행을 확인했다. 설정 제목은 영어, 목록은 한국어로 표시됐다.</figcaption></figure>
<figure><h2>S01 · 복구 완료</h2><a href="S01-synthetic-restored.png"><img src="S01-synthetic-restored.png" alt="이 기기에 운동 2건과 세트 3개를 복구했습니다. 운동 장소 · 1"></a><figcaption>서버 연결 없이 합성 운동 2건·세트 3개·장소 1건을 임시 저장소로 복구했다. 전용 iPhone의 테스트 윈도우에 실제 설정 화면을 표시해 장소 수와 성공 문구를 확인했다. 같은 자료를 다시 적용하면 추가 건수는 0이고 장소 행은 표시되지 않았다.</figcaption></figure><figure><h2>H07 · 자세 사진 원본</h2><a href="H07-original-photo-actions.png"><img src="H07-original-photo-actions.png" alt="합성 정면·측면 사진 아래 각각 보이는 원본 저장 버튼"></a><figcaption>전용 iPhone 시뮬레이터에서 기존 자세 상세 화면에 두 방향의 원본 저장 버튼이 표시됐다. 사진은 시스템 기호로 만든 표본이다. 실물 외장 드라이브 쓰기는 별도 검증이 필요하다.</figcaption></figure><figure><h2>S01 · 암호화 백업 파일</h2><a href="S01-encrypted-backup-file.png"><img src="S01-encrypted-backup-file.png" alt="전체 기록은 기기나 외장 드라이브에, 화면 설정과 단위는 iCloud Drive에 저장하는 선택"></a><figcaption>전체 기록 백업, 테마·앱 아이콘·무게 단위 파일 내보내기, 백업 파일에서 복원을 각각 확인했다.</figcaption></figure>
<figure><h2>S01 · 복구 키 보관</h2><a href="S01-backup-key-hidden.png"><img src="S01-backup-key-hidden.png" alt="복구 키는 가려져 있고, 키 보관 확인 전 기기·외장 드라이브 저장 버튼이 비활성 상태"></a><figcaption>키를 보기 또는 복사한 다음 별도 보관을 확인해야 저장할 수 있다. 이 검사에서는 키를 보거나 복사하지 않았다.</figcaption></figure><figure><h2>W28 · 열어 둔 운동에 장소 복원</h2><a href="W28-live-restored-place.png"><img src="W28-live-restored-place.png" alt="천국의 계단 상세에 합성 장소 Cobalt Test Gym과 Set 1 73 reps가 보인다"></a><figcaption>건강 운동의 상세를 먼저 열었다. 합성 백업을 가져온 뒤 같은 창에 수기 장소명과 73회 세트가 표시됐다. 개인 장소와 지도 타일은 시험에 쓰지 않았다.</figcaption></figure></main>
<p>일반 iPhone의 동의·설정 UI 검사 2건과 합성 복구 결과 검사 1건을 실행했다. 개인 iCloud에서의 내려받기, iPad·Duo의 배치, 저장소 열기 실패 화면은 이 검사 범위 밖이다.</p>
