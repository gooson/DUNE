<!doctype html>

<title>A01 · iPad Activity 카드 배치</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 2rem auto; padding: 0 1rem; max-width: 76rem; background: #241f1c; color: #f3eae1; font: 1rem/1.55 system-ui, sans-serif; }
  a { color: #f6bf8c; } h1, h2 { line-height: 1.2; }
  section { margin-top: 2rem; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1.5rem; align-items: start; }
  figure { margin: 0; } figcaption { margin: .5rem 0 1rem; }
  img { width: 100%; height: auto; display: block; }
</style>
<main>
  <a href="../index.html">전체 실제 화면 디자인맵</a>
  <h1>iPad Activity 카드 배치</h1>
  <p>iPad Pro 13형(M5), iPad mini(A20 Pro) · iPadOS 27.2 · 한국어 · 다크 모드 · 기본 글씨 · 테스트용 운동 기록</p>
  <section>
    <h2>개인 기록과 달성 히스토리</h2>
    <div class="pair">
      <figure><a href="before-records.png"><img src="before-records.png" alt="개인 기록 옆 달성 히스토리 아래가 크게 비어 있는 수정 전 화면"></a><figcaption>수정 전. 기록 8개가 네 줄로 쌓이고, 오른쪽 달성 히스토리 아래 약 823pt가 비었다.</figcaption></figure>
      <figure><a href="portrait-records.png"><img src="portrait-records.png" alt="개인 기록 8개가 네 개씩 두 줄로 배치되고 다음 섹션이 바로 이어지는 화면"></a><figcaption>수정 후. 한 줄에 기록 4개를 보여주고 그 아래에 달성 히스토리와 주간 운동이 16pt 간격으로 이어진다.</figcaption></figure>
    </div>
  </section>
  <p><a href="mini-portrait-records.png">iPad mini 세로 화면</a>에서는 기록 8개가 3개, 3개, 2개씩 배치된다. 마지막 줄의 카드 2개가 폭을 나눠 위 줄과 양쪽 끝이 맞는다.</p>
  <section>
    <h2>추천 운동</h2>
    <div class="pair">
      <figure><a href="before-suggested.png"><img loading="lazy" src="before-suggested.png" alt="좁은 추천 운동 카드에서 이름과 추천 이유가 잘린 화면"></a><figcaption>수정 전. 본문의 절반에 추천 운동을 배치하고 그 안을 다시 둘로 나눴다.</figcaption></figure>
      <figure><a href="portrait-suggested.png"><img loading="lazy" src="portrait-suggested.png" alt="전체 본문 폭에서 운동 이름과 세트 수를 읽을 수 있는 두 열의 추천 운동"></a><figcaption>수정 후. 네 가지 운동의 이름, 추천 이유, 세트 수와 시작 버튼을 두 열로 표시한다.</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>가로 화면과 사이드바</h2>
    <div class="pair">
      <figure><a href="sidebar-records.png"><img loading="lazy" src="sidebar-records.png" alt="사이드바 옆 본문에서 개인 기록과 달성 히스토리가 이어지는 가로 화면"></a><figcaption>개인 기록과 달성 히스토리</figcaption></figure>
      <figure><a href="sidebar-suggested.png"><img loading="lazy" src="sidebar-suggested.png" alt="사이드바를 연 상태에서 본문 폭을 나눠 쓰는 추천 운동"></a><figcaption>추천 운동</figcaption></figure>
      <figure><a href="landscape-weekly.png"><img loading="lazy" src="landscape-weekly.png" alt="주간 운동 지표와 바로 아래 주간 리포트가 보이는 가로 화면"></a><figcaption>주간 운동과 주간 리포트</figcaption></figure>
    </div>
  </section>
  <p><a href="portrait-readiness.png">세로 화면의 준비도와 근육 지도</a> · <a href="captures.json">캡처 출처와 검증 결과</a></p>
