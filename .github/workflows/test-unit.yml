name: Unit Tests

on:
  # Workflow-only edits use static validation; dispatch explicitly to exercise CI.
  workflow_dispatch:
  pull_request:
    branches: [main, 'codex/ios27-*']
    paths:
      - 'DUNE/**'
      - 'DUNEWatch/**'
      - 'DUNEWidget/**'
      - 'Shared/**'
      - 'DUNETests/**'
      - 'DUNEWatchTests/**'
      - 'scripts/test-unit.sh'
      - 'scripts/lib/xcodebuild-resources.sh'
      - 'scripts/lib/regen-project.sh'
      - 'scripts/lib/simulator-boot.sh'
      - 'scripts/lib/simulator-worktree.sh'
      - 'scripts/lib/simulator-test-lock.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMULATOR_BOOT_TIMEOUT: '300'
  SIMULATOR_BOOT_RETRIES: '2'

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 30
    # Boot each runtime on its own runner. A Watch startup failure must not
    # prevent iOS tests from starting, or leave both runtimes competing for RAM.
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, watch]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer

      - name: Simulator diagnostics
        if: always()
        run: |
          echo "── Xcode version ──"
          xcodebuild -version
          echo ""
          echo "── Available runtimes ──"
          xcrun simctl list runtimes
          echo ""
          echo "── Available simulators (iOS + watchOS) ──"
          xcrun simctl list devices available | grep -E "(iOS|watchOS)" -A5 | head -40

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run Unit Tests
        shell: bash
        run: |
          mkdir -p .xcodebuild
          scripts/test-unit.sh --${{ matrix.platform }}-only --stream-log 2>&1 | tee .xcodebuild/unit-test-runner.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ matrix.platform }}
          path: .xcodebuild/unit-test*.log
          include-hidden-files: true
          retention-days: 7
