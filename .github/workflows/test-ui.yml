name: UI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'DUNE/**'
      - 'DUNEWatch/**'
      - 'DUNEUITests/**'
      - 'DUNEWatchUITests/**'
      - 'Shared/**'
      - 'scripts/test-ui.sh'
      - 'scripts/plan-ui-tests.py'
      - 'scripts/lib/verify-ui-test-log.py'
      - 'scripts/tests/test_plan_ui_tests.py'
      - 'scripts/tests/test_ui_test_runner.py'
      - 'scripts/test-watch-ui.sh'
      - 'scripts/lib/regen-project.sh'
      - 'scripts/lib/simulator-boot.sh'
      - 'scripts/lib/simulator-worktree.sh'
      - '.github/workflows/test-ui.yml'

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  SIMULATOR_BOOT_TIMEOUT: '300'
  SIMULATOR_BOOT_RETRIES: '2'

jobs:
  ui-gate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
      watch: ${{ steps.scope.outputs.watch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine affected UI platforms
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/plan-ui-tests.py --base "$PR_BASE_SHA" > "$RUNNER_TEMP/ui-scope.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ui-scope.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for platform, scope in plan["platforms"].items():
                  print(f"{platform}={str(scope['mode'] != 'skip').lower()}", file=output)
          PY
      - name: Verify UI selection and execution evidence contracts
        run: |
          python3 -B -m unittest discover -s scripts/tests -p test_plan_ui_tests.py -v
          python3 -B -m unittest discover -s scripts/tests -p test_ui_test_runner.py -v
          bash -n scripts/test-ui.sh

  ios-ui-tests:
    needs: ui-gate-contracts
    if: github.event.pull_request.draft == false && needs.ui-gate-contracts.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Simulator diagnostics
        if: always()
        run: |
          echo "── Xcode version ──"
          xcodebuild -version
          echo ""
          echo "── Available runtimes ──"
          xcrun simctl list runtimes
          echo ""
          echo "── Available simulators ──"
          xcrun simctl list devices available | grep -E "(iOS|watchOS)" -A5 | head -40

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run iOS UI Tests
        run: scripts/test-ui.sh --stream-log --smoke --skip-testing DUNEUITests/HealthKitPermissionUITests

      - name: Upload iOS UI test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-log
          path: .xcodebuild/ui-test.log
          retention-days: 7

  watch-ui-tests:
    needs: ui-gate-contracts
    if: github.event.pull_request.draft == false && needs.ui-gate-contracts.outputs.watch == 'true'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Simulator diagnostics
        if: always()
        run: |
          echo "── Xcode version ──"
          xcodebuild -version
          echo ""
          echo "── Available runtimes ──"
          xcrun simctl list runtimes
          echo ""
          echo "── Available simulators ──"
          xcrun simctl list devices available | grep -E "(iOS|watchOS)" -A5 | head -40

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run watch UI Tests
        run: scripts/test-watch-ui.sh --stream-log --smoke --log-file .xcodebuild/watch-ui-test.log

      - name: Upload watch UI test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-ui-test-log
          path: .xcodebuild/watch-ui-test.log
          retention-days: 7
